openapi: 3.0.3
info:
  title: Charge Console API
  version: 1.5.2
  description: |
    Charge Console 1.5.2 按需整桩空闲提醒、站内通知与 WxPusher 可靠投递契约。
    临时提醒仅在用户指定时长内按桩号低频检查，首次发现空闲并生成通知后自动结束。
    WxPusher 是附加投递渠道；站内通知始终是事实来源，供应商成功不代表特定微信客户端已读。
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: History
    description: 当前登录普通用户所绑定充电桩的历史分析
  - name: Admin Trends
    description: 管理员运营趋势分析
  - name: Admin Operations
    description: 管理员提醒策略、调度状态与数据保留运维
  - name: Watch Rules
    description: 当前普通用户按充电桩设置的空闲提醒规则
  - name: Notifications
    description: 当前普通用户的通知偏好与站内通知箱
  - name: WxPusher
    description: 当前普通用户的 WxPusher 绑定、偏好、测试消息与最近投递结果
paths:
  /api/watch-rules:
    get:
      operationId: listWatchRules
      summary: 获取当前用户的全部整桩空闲提醒规则
      tags: [Watch Rules]
      responses:
        "200":
          description: 按更新时间倒序返回的空闲提醒规则
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchRule"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WatchUnavailable"
    post:
      operationId: createWatchRule
      summary: 为充电桩创建空闲提醒规则
      tags: [Watch Rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRuleCreateRequest"
      responses:
        "201":
          description: 首次整桩检查结果；无空闲口时包含已创建的临时或固定提醒规则
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchRuleCreateResult"
        "400":
          $ref: "#/components/responses/WatchInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/WatchTargetNotFound"
        "409":
          $ref: "#/components/responses/WatchConflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WatchUnavailable"
  /api/watch-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/WatchRuleId"
    patch:
      operationId: updateWatchRule
      summary: 更新空闲提醒规则状态和生效时段
      tags: [Watch Rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRuleUpdateRequest"
      responses:
        "200":
          description: 更新后的空闲提醒规则
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchRule"
        "400":
          $ref: "#/components/responses/WatchInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/WatchRuleNotFound"
        "409":
          $ref: "#/components/responses/WatchConflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WatchUnavailable"
    delete:
      operationId: deleteWatchRule
      summary: 删除空闲提醒规则
      tags: [Watch Rules]
      responses:
        "204":
          description: 空闲提醒规则已删除
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/WatchRuleNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WatchUnavailable"
  /api/watch-overview:
    get:
      operationId: getWatchOverview
      summary: 获取当前用户的空闲提醒额度与后台策略摘要
      tags: [Watch Rules]
      responses:
        "200":
          description: 仅包含当前用户用量和管理员公开给普通用户的提醒策略
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WatchUnavailable"
  /api/notification-preferences:
    get:
      operationId: getNotificationPreference
      summary: 获取当前用户的通知偏好
      tags: [Notifications]
      responses:
        "200":
          description: 浏览器通知意愿与免打扰设置
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreference"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
    patch:
      operationId: updateNotificationPreference
      summary: 更新通知偏好
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferenceUpdateRequest"
      responses:
        "200":
          description: 更新后的通知偏好
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreference"
        "400":
          $ref: "#/components/responses/NotificationPreferenceInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
  /api/notifications:
    get:
      operationId: listNotifications
      summary: 分页获取当前用户的站内通知
      tags: [Notifications]
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NotificationStatusFilter"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 通知分页、下一游标和总未读数量
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "#/components/responses/NotificationQueryInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
  /api/notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    post:
      operationId: markNotificationRead
      summary: 将单条通知标记为已读
      tags: [Notifications]
      responses:
        "200":
          description: 已读后的通知
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
  /api/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: 将当前用户的全部未读通知标记为已读
      tags: [Notifications]
      responses:
        "200":
          description: 实际更新数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedCount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
  /api/notifications/resolved:
    delete:
      operationId: deleteResolvedNotifications
      summary: 清理当前用户已经解决的通知
      tags: [Notifications]
      responses:
        "200":
          description: 实际删除数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedCount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
  /api/notification-channels/wxpusher:
    get:
      operationId: getWxPusherChannel
      summary: 获取当前用户的 WxPusher 通道状态
      tags: [WxPusher]
      responses:
        "200":
          description: 配置可用性、绑定状态、事件偏好和最近投递结果；不返回完整 UID 或 AppToken
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WxPusherChannelState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WxPusherUnavailable"
    patch:
      operationId: updateWxPusherChannel
      summary: 更新 WxPusher 总开关和事件类型偏好
      tags: [WxPusher]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WxPusherChannelUpdateRequest"
      responses:
        "200":
          description: 更新后的通道状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WxPusherChannelState"
        "400":
          $ref: "#/components/responses/WxPusherInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "409":
          $ref: "#/components/responses/WxPusherChannelConflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WxPusherUnavailable"
    delete:
      operationId: deleteWxPusherChannel
      summary: 解除当前用户的本地 WxPusher 绑定
      description: 删除本地 UID 并取消尚未开始的投递任务，不承诺替用户取消关注 WxPusher 应用或退出接收客户端。
      tags: [WxPusher]
      responses:
        "204":
          description: 已解除绑定；重复调用同样成功
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WxPusherUnavailable"
  /api/notification-channels/wxpusher/bind-sessions:
    post:
      operationId: createWxPusherBindSession
      summary: 创建十分钟有效的 WxPusher 参数二维码绑定会话
      tags: [WxPusher]
      responses:
        "201":
          description: 等待扫码的绑定会话；Provider code 不对前端公开
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WxPusherBindSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "409":
          $ref: "#/components/responses/WxPusherBindingConflict"
        "429":
          $ref: "#/components/responses/WxPusherRateLimited"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WxPusherUnavailable"
  /api/notification-channels/wxpusher/bind-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/WxPusherBindSessionId"
    get:
      operationId: getWxPusherBindSession
      summary: 查询当前用户的 WxPusher 绑定进度
      description: 前端建议每十秒查询一次；后端强制限制向供应商轮询的最短间隔。
      tags: [WxPusher]
      responses:
        "200":
          description: 等待扫码、已绑定、已过期或失败状态
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WxPusherBindSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/WxPusherBindSessionNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WxPusherUnavailable"
  /api/notification-channels/wxpusher/test:
    post:
      operationId: testWxPusherChannel
      summary: 为当前用户创建一条受频率限制的 WxPusher 测试投递
      tags: [WxPusher]
      responses:
        "202":
          description: 测试投递已进入持久队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliverySummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "409":
          $ref: "#/components/responses/WxPusherChannelConflict"
        "429":
          $ref: "#/components/responses/WxPusherRateLimited"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WxPusherUnavailable"
  /api/admin/trends:
    get:
      operationId: getAdminTrends
      summary: 获取管理员运营趋势
      tags: [Admin Trends]
      parameters:
        - $ref: "#/components/parameters/AdminTrendRange"
        - $ref: "#/components/parameters/Timezone"
      responses:
        "200":
          description: 请求量、远端成功率、活跃用户和离线端口趋势
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTrendsResponse"
        "400":
          $ref: "#/components/responses/InvalidAdminTrendQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AdminTrendsUnavailable"
  /api/admin/trends.csv:
    get:
      operationId: exportAdminTrendsCSV
      summary: 导出管理员运营趋势 CSV
      tags: [Admin Trends]
      parameters:
        - $ref: "#/components/parameters/AdminTrendRange"
        - $ref: "#/components/parameters/Timezone"
      responses:
        "200":
          description: 与相同范围趋势接口数值一致的 UTF-8 BOM CSV 文件
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Content-Disposition:
              $ref: "#/components/headers/CSVContentDisposition"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidAdminTrendQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AdminTrendsUnavailable"
  /api/admin/settings:
    get:
      operationId: getAdminSettings
      summary: 获取系统注册、提醒与保留策略
      tags: [Admin Operations]
      responses:
        "200":
          description: 当前完整系统策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    put:
      operationId: updateAdminSettings
      summary: 更新系统注册、提醒与保留策略
      description: 修改结果会写入管理员审计日志，并立即唤醒提醒调度器。
      tags: [Admin Operations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationSettings"
      responses:
        "200":
          description: 保存后的完整系统策略
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationSettings"
        "400":
          description: 参数范围或时区无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /api/admin/operations:
    get:
      operationId: getAdminOperations
      summary: 获取数据库、备份、通知与提醒调度状态
      tags: [Admin Operations]
      responses:
        "200":
          description: 当前运维状态和过去 24 小时提醒调度指标
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: 数据库运维信息暂时不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/piles/{deviceId}/history:
    get:
      operationId: getDeviceHistory
      summary: 获取充电桩历史分析
      tags: [History]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/HistoryRange"
        - $ref: "#/components/parameters/Timezone"
      responses:
        "200":
          description: 设备维度的历史指标、每日趋势、热力图和端口摘要
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceHistoryResponse"
        "400":
          $ref: "#/components/responses/InvalidHistoryQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/HistoryNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/HistoryRangeTooLarge"
        "503":
          $ref: "#/components/responses/HistoryUnavailable"
  /api/piles/{deviceId}/ports/{portId}/history:
    get:
      operationId: getPortHistory
      summary: 获取单个充电口历史分析
      tags: [History]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/PortId"
        - $ref: "#/components/parameters/HistoryRange"
        - $ref: "#/components/parameters/Timezone"
      responses:
        "200":
          description: 单个端口的历史指标、每日趋势和最近状态时间线
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortHistoryResponse"
        "400":
          $ref: "#/components/responses/InvalidPortHistoryQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/HistoryNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/HistoryRangeTooLarge"
        "503":
          $ref: "#/components/responses/HistoryUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: charge_session
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 当前用户已绑定的 6–64 位数字设备 ID
      schema:
        type: string
        pattern: "^[0-9]{6,64}$"
    PortId:
      name: portId
      in: path
      required: true
      description: 充电口编号
      schema:
        type: integer
        minimum: 1
        maximum: 100
    HistoryRange:
      name: range
      in: query
      required: false
      description: 历史统计范围；省略时使用 7d
      schema:
        $ref: "#/components/schemas/HistoryRange"
    AdminTrendRange:
      name: range
      in: query
      required: false
      description: 趋势统计范围；省略时使用 24h
      schema:
        $ref: "#/components/schemas/AdminTrendRange"
    Timezone:
      name: timezone
      in: query
      required: false
      description: IANA 时区名称；省略时使用 Asia/Shanghai
      schema:
        type: string
        maxLength: 64
        default: Asia/Shanghai
        example: Asia/Shanghai
    WatchRuleId:
      name: ruleId
      in: path
      required: true
      description: 当前用户空闲提醒规则 ID
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9_.-]+$"
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 当前用户通知 ID
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9_.-]+$"
    WxPusherBindSessionId:
      name: sessionId
      in: path
      required: true
      description: 当前用户的随机绑定会话 ID
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9_.-]+$"
  headers:
    PrivateNoStore:
      description: 分析响应包含用户或运营数据，不允许共享或本地缓存
      schema:
        type: string
        enum: ["private, no-store"]
    CSVContentDisposition:
      description: 包含范围和导出日期的安全 ASCII 文件名
      schema:
        type: string
        example: attachment; filename="charge-trends-7d-2026-08-05.csv"
  responses:
    InvalidAdminTrendQuery:
      description: 趋势范围或时区参数无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: ADMIN_TREND_QUERY_INVALID
            error: 趋势范围或时区参数无效
    InvalidHistoryQuery:
      description: 设备 ID、历史范围或时区参数无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          examples:
            invalidDevice:
              value:
                code: DEVICE_ID_INVALID
                error: 设备 ID 格式无效
            invalidQuery:
              value:
                code: HISTORY_QUERY_INVALID
                error: 历史范围或时区参数无效
    InvalidPortHistoryQuery:
      description: 设备 ID、端口编号、历史范围或时区参数无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          examples:
            invalidPort:
              value:
                code: PORT_ID_INVALID
                error: 充电口编号格式无效
            invalidQuery:
              value:
                code: HISTORY_QUERY_INVALID
                error: 历史范围或时区参数无效
    Unauthenticated:
      description: 未登录或会话已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: login required
    OrdinaryUserRequired:
      description: 当前账户不是普通用户
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: ordinary user permission required
    AdminRequired:
      description: 当前账户不是管理员
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: admin permission required
    HistoryNotFound:
      description: 设备不属于当前用户、端口不存在或尚无该端口历史
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: HISTORY_NOT_FOUND
            error: 未找到对应的历史记录
    MethodNotAllowed:
      description: 请求方法不受支持
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: method not allowed
    HistoryRangeTooLarge:
      description: 所选范围内的状态变化超过单次分析上限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: HISTORY_RANGE_TOO_LARGE
            error: 该范围内历史变化过多，请缩短查询范围
    HistoryUnavailable:
      description: 历史存储或聚合暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: HISTORY_UNAVAILABLE
            error: 历史数据暂时不可用，请稍后重试
    AdminTrendsUnavailable:
      description: 指标或状态历史聚合暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: ADMIN_TRENDS_UNAVAILABLE
            error: 运营趋势暂时不可用，请稍后重试
    WatchInvalid:
      description: 空闲提醒规则字段、星期、时段或时区无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WATCH_RULE_INVALID
            error: 空闲提醒规则内容无效
    WatchTargetNotFound:
      description: 充电桩不属于当前用户
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WATCH_TARGET_NOT_FOUND
            error: 未找到当前账户下的充电桩
    WatchRuleNotFound:
      description: 规则不存在或不属于当前用户
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WATCH_RULE_NOT_FOUND
            error: 未找到空闲提醒规则
    WatchConflict:
      description: 目标已存在，或达到规则/提醒桩数量限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
    WatchUnavailable:
      description: 空闲提醒规则存储暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WATCH_UNAVAILABLE
            error: 空闲提醒功能暂时不可用，请稍后重试
    NotificationPreferenceInvalid:
      description: 通知偏好、免打扰时间或时区无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: NOTIFICATION_PREFERENCE_INVALID
            error: 通知偏好内容无效
    NotificationQueryInvalid:
      description: 通知状态、分页大小或游标无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: NOTIFICATION_QUERY_INVALID
            error: 通知筛选或分页参数无效
    NotificationNotFound:
      description: 通知不存在或不属于当前用户
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: NOTIFICATION_NOT_FOUND
            error: 未找到通知
    NotificationUnavailable:
      description: 通知存储暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: NOTIFICATION_UNAVAILABLE
            error: 通知功能暂时不可用，请稍后重试
    WxPusherInvalid:
      description: WxPusher 通道开关或事件类型设置无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WXPUSHER_INVALID
            error: WxPusher 提醒设置无效
    WxPusherChannelConflict:
      description: 当前用户尚未绑定 WxPusher，或微信提醒总开关处于关闭状态
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          examples:
            notBound:
              value:
                code: WXPUSHER_NOT_BOUND
                error: 请先绑定 WxPusher
            channelDisabled:
              value:
                code: WXPUSHER_CHANNEL_DISABLED
                error: 请先开启微信提醒
    WxPusherBindingConflict:
      description: 当前用户已有活动会话，或该 UID 已绑定其他 Charge Console 账户
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          examples:
            activeSession:
              value:
                code: WXPUSHER_BIND_SESSION_ACTIVE
                error: 已有等待扫码的绑定会话
            uidConflict:
              value:
                code: WXPUSHER_UID_CONFLICT
                error: 该 WxPusher 账户已绑定其他用户
    WxPusherBindSessionNotFound:
      description: 绑定会话不存在、已清理或不属于当前用户
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WXPUSHER_BIND_SESSION_NOT_FOUND
            error: 未找到绑定会话
    WxPusherRateLimited:
      description: 创建二维码或发送测试消息过于频繁
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WXPUSHER_RATE_LIMITED
            error: 操作过于频繁，请稍后再试
    WxPusherUnavailable:
      description: WxPusher 未配置、存储不可用或供应商暂时异常；站内通知不受影响
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          examples:
            notConfigured:
              value:
                code: WXPUSHER_NOT_CONFIGURED
                error: 管理员尚未启用 WxPusher
            providerUnavailable:
              value:
                code: WXPUSHER_UNAVAILABLE
                error: WxPusher 暂时不可用，请稍后重试
  schemas:
    RegistrationSettings:
      type: object
      additionalProperties: false
      required:
        - openRegistration
        - inviteRequired
        - defaultDeviceLimit
        - defaultRefreshEnabled
        - statsRetentionDays
        - portHistoryRetentionDays
        - backgroundRemindersEnabled
        - recurringRemindersEnabled
        - watchRefreshIntervalMinutes
        - watchPileLimitPerUser
        - watchDailyRefreshQuota
        - notificationRetentionDays
        - scheduledPowerOffEnabled
        - scheduledPowerOffStartMinute
        - scheduledPowerOffEndMinute
        - scheduledPowerOffTimezone
        - powerRestoreJitterMinutes
      properties:
        openRegistration:
          type: boolean
        inviteRequired:
          type: boolean
        defaultDeviceLimit:
          type: integer
          minimum: 1
          maximum: 100
        defaultRefreshEnabled:
          type: boolean
        statsRetentionDays:
          type: integer
          minimum: 1
          maximum: 365
        portHistoryRetentionDays:
          type: integer
          minimum: 1
          maximum: 365
        backgroundRemindersEnabled:
          type: boolean
        recurringRemindersEnabled:
          type: boolean
          description: 是否允许高级固定时段提醒进入后台调度；关闭后保留用户配置，临时提醒不受影响。
        watchRefreshIntervalMinutes:
          type: integer
          minimum: 5
          maximum: 60
        watchPileLimitPerUser:
          type: integer
          minimum: 1
          maximum: 20
        watchDailyRefreshQuota:
          type: integer
          minimum: 1
          maximum: 10000
        notificationRetentionDays:
          type: integer
          minimum: 7
          maximum: 365
        scheduledPowerOffEnabled:
          type: boolean
        scheduledPowerOffStartMinute:
          type: integer
          minimum: 0
          maximum: 1439
        scheduledPowerOffEndMinute:
          type: integer
          minimum: 0
          maximum: 1439
        scheduledPowerOffTimezone:
          type: string
          maxLength: 64
        powerRestoreJitterMinutes:
          type: integer
          minimum: 0
          maximum: 60
    ReminderOperationsStatus:
      type: object
      additionalProperties: false
      required:
        - state
        - message
        - enabled
        - schedulerRunning
        - scheduledPowerOffActive
        - trackedPiles
        - duePiles
        - inFlightPiles
        - remoteAttempts24Hours
        - remoteSuccesses24Hours
        - remoteFailures24Hours
        - remoteSuccessRate24Hours
        - cacheHits24Hours
        - coalesced24Hours
        - quotaSkips24Hours
        - schedulerErrors24Hours
        - maxConsecutiveFailures
      properties:
        state:
          type: string
          enum: [healthy, degraded, disabled, power_off, stopped]
        message:
          type: string
        enabled:
          type: boolean
        schedulerRunning:
          type: boolean
        scheduledPowerOffActive:
          type: boolean
        trackedPiles:
          type: integer
          minimum: 0
        duePiles:
          type: integer
          minimum: 0
        inFlightPiles:
          type: integer
          minimum: 0
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        remoteAttempts24Hours:
          type: integer
          minimum: 0
        remoteSuccesses24Hours:
          type: integer
          minimum: 0
        remoteFailures24Hours:
          type: integer
          minimum: 0
        remoteSuccessRate24Hours:
          type: number
          format: double
          minimum: 0
          maximum: 100
        cacheHits24Hours:
          type: integer
          minimum: 0
        coalesced24Hours:
          type: integer
          minimum: 0
        quotaSkips24Hours:
          type: integer
          minimum: 0
        schedulerErrors24Hours:
          type: integer
          minimum: 0
        maxConsecutiveFailures:
          type: integer
          minimum: 0
    OperationsStatus:
      type: object
      additionalProperties: false
      required:
        - databaseSizeBytes
        - metricRows
        - metricRetentionDays
        - portHistoryRows
        - portHistoryRetentionDays
        - integrityResult
        - checkedAt
        - backupState
        - backupMessage
        - notificationRows
        - resolvedNotificationRows
        - notificationRetentionDays
        - reminders
      properties:
        databaseSizeBytes:
          type: integer
          format: int64
          minimum: 0
        metricRows:
          type: integer
          format: int64
          minimum: 0
        metricRetentionDays:
          type: integer
          minimum: 1
        portHistoryRows:
          type: integer
          format: int64
          minimum: 0
        portHistoryRetentionDays:
          type: integer
          minimum: 1
        portHistoryOldestAt:
          type: string
          format: date-time
          nullable: true
        portHistoryNewestAt:
          type: string
          format: date-time
          nullable: true
        integrityResult:
          type: string
        checkedAt:
          type: string
          format: date-time
        lastBackupAt:
          type: string
          format: date-time
          nullable: true
        lastBackupSizeBytes:
          type: integer
          format: int64
          minimum: 0
        backupState:
          type: string
          enum: [healthy, degraded, unavailable]
        backupMessage:
          type: string
        notificationRows:
          type: integer
          format: int64
          minimum: 0
        resolvedNotificationRows:
          type: integer
          format: int64
          minimum: 0
        notificationRetentionDays:
          type: integer
          minimum: 7
          maximum: 365
        reminders:
          $ref: "#/components/schemas/ReminderOperationsStatus"
    WatchOverview:
      type: object
      additionalProperties: false
      required:
        - reminderPileCount
        - reminderPileLimit
        - dailyQuotaUsed
        - dailyQuotaLimit
        - quotaDate
        - refreshIntervalMinutes
        - backgroundRemindersEnabled
        - accountRefreshEnabled
        - scheduledPowerOffEnabled
        - scheduledPowerOffStartMinute
        - scheduledPowerOffEndMinute
        - scheduledPowerOffTimezone
      properties:
        reminderPileCount:
          type: integer
          minimum: 0
        reminderPileLimit:
          type: integer
          minimum: 1
        dailyQuotaUsed:
          type: integer
          minimum: 0
        dailyQuotaLimit:
          type: integer
          minimum: 1
        quotaDate:
          type: string
          format: date
        refreshIntervalMinutes:
          type: integer
          minimum: 1
        backgroundRemindersEnabled:
          type: boolean
        accountRefreshEnabled:
          type: boolean
        scheduledPowerOffEnabled:
          type: boolean
        scheduledPowerOffStartMinute:
          type: integer
          minimum: 0
          maximum: 1439
        scheduledPowerOffEndMinute:
          type: integer
          minimum: 0
          maximum: 1439
        scheduledPowerOffTimezone:
          type: string
          maxLength: 64
    WatchRule:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - deviceId
        - mode
        - enabled
        - activeWeekdays
        - activeStartMinute
        - activeEndMinute
        - timezone
        - stopAfterNotify
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        deviceId:
          type: string
          pattern: "^[0-9]{6,64}$"
        mode:
          $ref: "#/components/schemas/WatchRuleMode"
        enabled:
          type: boolean
        activeWeekdays:
          type: integer
          minimum: 1
          maximum: 127
          description: 星期位掩码，bit 0 至 bit 6 依次代表周一至周日。
        activeStartMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: 当地时区当天起始分钟；与结束分钟相同时表示全天。
        activeEndMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: 当地时区当天结束分钟；小于起始分钟时表示跨午夜。
        timezone:
          type: string
          maxLength: 64
        expiresAt:
          type: string
          format: date-time
          description: 临时提醒的硬截止时间；固定提醒不返回。
        completedAt:
          type: string
          format: date-time
        completionReason:
          $ref: "#/components/schemas/WatchCompletionReason"
        stopAfterNotify:
          type: boolean
          description: 临时提醒固定为 true，固定提醒固定为 false。
        nextCheckAt:
          type: string
          format: date-time
          description: 当前活动提醒预计下次后台检查时间。
        estimatedRemainingChecks:
          type: integer
          minimum: 0
          description: 在过期或计划断电前预计最多还会执行的整桩后台检查次数。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WatchRuleCreateRequest:
      type: object
      additionalProperties: false
      required: [deviceId]
      properties:
        deviceId:
          type: string
          pattern: "^[0-9]{6,64}$"
        mode:
          $ref: "#/components/schemas/WatchRuleMode"
          description: 省略时由服务端使用 temporary。
        duration:
          $ref: "#/components/schemas/WatchTemporaryDuration"
          description: 仅用于 temporary；省略时使用 2h，且服务端会将截止时间限制在当天计划断电开始前。
        enabled:
          type: boolean
        activeWeekdays:
          type: integer
          minimum: 1
          maximum: 127
          description: 星期位掩码，bit 0 至 bit 6 依次代表周一至周日。
        activeStartMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: 当地时区当天起始分钟；与结束分钟相同时表示全天。
        activeEndMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: 当地时区当天结束分钟；小于起始分钟时表示跨午夜。
        timezone:
          type: string
          maxLength: 64
    WatchRuleUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        duration:
          $ref: "#/components/schemas/WatchTemporaryDuration"
        cancel:
          type: boolean
          description: true 表示将活动临时提醒原子标记为 cancelled；固定提醒不接受该字段。
        activeWeekdays:
          type: integer
          minimum: 1
          maximum: 127
          description: 星期位掩码，bit 0 至 bit 6 依次代表周一至周日。
        activeStartMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: 当地时区当天起始分钟；与结束分钟相同时表示全天。
        activeEndMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: 当地时区当天结束分钟；小于起始分钟时表示跨午夜。
        timezone:
          type: string
          maxLength: 64
    WatchRuleMode:
      type: string
      enum: [temporary, recurring]
      description: temporary 是默认按需任务；recurring 是保留的高级固定时段规则。
    WatchTemporaryDuration:
      type: string
      enum: [1h, 2h, 4h, until_power_off]
    WatchCompletionReason:
      type: string
      enum: [notified, expired, cancelled]
    WatchRuleCreateResult:
      type: object
      additionalProperties: false
      required: [idlePortIds, backgroundScheduled, message]
      properties:
        rule:
          $ref: "#/components/schemas/WatchRule"
        idlePortIds:
          type: array
          items:
            type: integer
            minimum: 1
        backgroundScheduled:
          type: boolean
        message:
          type: string
          maxLength: 200
    WxPusherEventType:
      type: string
      enum: [pile_available, credential_expired, pile_offline, pile_recovered]
    WxPusherChannelState:
      type: object
      additionalProperties: false
      required:
        - configured
        - bound
        - enabled
        - eventTypes
        - deliveryDisclaimer
      properties:
        configured:
          type: boolean
          description: 服务端是否配置 AppToken；AppToken 本身永不返回。
        bound:
          type: boolean
        enabled:
          type: boolean
        maskedUid:
          type: string
          maxLength: 32
          description: 仅用于帮助用户识别绑定，不返回完整 UID。
        eventTypes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WxPusherEventType"
        boundAt:
          type: string
          format: date-time
        lastTestAt:
          type: string
          format: date-time
        lastDelivery:
          $ref: "#/components/schemas/NotificationDeliverySummary"
          description: 最近一次正式通知投递结果。
        lastTestDelivery:
          $ref: "#/components/schemas/NotificationDeliverySummary"
          description: 最近一次测试消息投递结果。
        deliveryDisclaimer:
          type: string
          description: 明确“WxPusher 已处理”不代表特定微信客户端已展示或已读。
    WxPusherChannelUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        eventTypes:
          type: array
          minItems: 0
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WxPusherEventType"
    WxPusherBindSessionStatus:
      type: string
      enum: [waiting_scan, bound, expired, failed]
    WxPusherBindSession:
      type: object
      additionalProperties: false
      required: [id, status, expiresAt, nextPollAt, message]
      properties:
        id:
          type: string
          maxLength: 128
        status:
          $ref: "#/components/schemas/WxPusherBindSessionStatus"
        qrUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 仅 waiting_scan 状态返回的官方 HTTPS 二维码地址。
        expiresAt:
          type: string
          format: date-time
        nextPollAt:
          type: string
          format: date-time
          description: 前端不得在此时间前再次查询绑定进度。
        completedAt:
          type: string
          format: date-time
        message:
          type: string
          maxLength: 200
        errorCode:
          $ref: "#/components/schemas/WxPusherErrorCode"
    NotificationDeliveryStatus:
      type: string
      enum:
        - pending
        - sending
        - accepted
        - provider_succeeded
        - retry_wait
        - suppressed
        - uncertain
        - failed
        - cancelled
