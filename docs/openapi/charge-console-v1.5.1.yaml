openapi: 3.0.3
info:
  title: Charge Console API
  version: 1.5.1
  description: |
    Charge Console 1.5.1 用户端历史、管理员趋势、整桩空闲提醒与站内通知契约。
    每个充电桩最多一条提醒规则；后台按桩号低频刷新，一次读取该桩全部端口。
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: History
    description: 当前登录普通用户所绑定充电桩的历史分析
  - name: Admin Trends
    description: 管理员运营趋势分析
  - name: Watch Rules
    description: 当前普通用户按充电桩设置的空闲提醒规则
  - name: Notifications
    description: 当前普通用户的通知偏好与站内通知箱
paths:
  /api/watch-rules:
    get:
      operationId: listWatchRules
      summary: 获取当前用户的全部关注规则
      tags: [Watch Rules]
      responses:
        "200":
          description: 按更新时间倒序返回的关注规则
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchRule"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WatchUnavailable"
    post:
      operationId: createWatchRule
      summary: 为充电桩创建空闲提醒规则
      tags: [Watch Rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRuleCreateRequest"
      responses:
        "201":
          description: 已创建的关注规则
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchRule"
        "400":
          $ref: "#/components/responses/WatchInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/WatchTargetNotFound"
        "409":
          $ref: "#/components/responses/WatchConflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WatchUnavailable"
  /api/watch-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/WatchRuleId"
    patch:
      operationId: updateWatchRule
      summary: 更新关注规则状态和生效时段
      tags: [Watch Rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRuleUpdateRequest"
      responses:
        "200":
          description: 更新后的关注规则
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchRule"
        "400":
          $ref: "#/components/responses/WatchInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/WatchRuleNotFound"
        "409":
          $ref: "#/components/responses/WatchConflict"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WatchUnavailable"
    delete:
      operationId: deleteWatchRule
      summary: 删除关注规则
      tags: [Watch Rules]
      responses:
        "204":
          description: 关注规则已删除
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/WatchRuleNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WatchUnavailable"
  /api/watch-overview:
    get:
      operationId: getWatchOverview
      summary: 获取当前用户的关注额度与后台提醒策略摘要
      tags: [Watch Rules]
      responses:
        "200":
          description: 仅包含当前用户用量和管理员公开给普通用户的提醒策略
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/WatchUnavailable"
  /api/notification-preferences:
    get:
      operationId: getNotificationPreference
      summary: 获取当前用户的通知偏好
      tags: [Notifications]
      responses:
        "200":
          description: 浏览器通知意愿与免打扰设置
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreference"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
    patch:
      operationId: updateNotificationPreference
      summary: 更新通知偏好
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferenceUpdateRequest"
      responses:
        "200":
          description: 更新后的通知偏好
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreference"
        "400":
          $ref: "#/components/responses/NotificationPreferenceInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
  /api/notifications:
    get:
      operationId: listNotifications
      summary: 分页获取当前用户的站内通知
      tags: [Notifications]
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/NotificationStatusFilter"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 通知分页、下一游标和总未读数量
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "#/components/responses/NotificationQueryInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
  /api/notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    post:
      operationId: markNotificationRead
      summary: 将单条通知标记为已读
      tags: [Notifications]
      responses:
        "200":
          description: 已读后的通知
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
  /api/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: 将当前用户的全部未读通知标记为已读
      tags: [Notifications]
      responses:
        "200":
          description: 实际更新数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedCount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
  /api/notifications/resolved:
    delete:
      operationId: deleteResolvedNotifications
      summary: 清理当前用户已经解决的通知
      tags: [Notifications]
      responses:
        "200":
          description: 实际删除数量
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedCount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotificationUnavailable"
  /api/admin/trends:
    get:
      operationId: getAdminTrends
      summary: 获取管理员运营趋势
      tags: [Admin Trends]
      parameters:
        - $ref: "#/components/parameters/AdminTrendRange"
        - $ref: "#/components/parameters/Timezone"
      responses:
        "200":
          description: 请求量、远端成功率、活跃用户和离线端口趋势
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTrendsResponse"
        "400":
          $ref: "#/components/responses/InvalidAdminTrendQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AdminTrendsUnavailable"
  /api/admin/trends.csv:
    get:
      operationId: exportAdminTrendsCSV
      summary: 导出管理员运营趋势 CSV
      tags: [Admin Trends]
      parameters:
        - $ref: "#/components/parameters/AdminTrendRange"
        - $ref: "#/components/parameters/Timezone"
      responses:
        "200":
          description: 与相同范围趋势接口数值一致的 UTF-8 BOM CSV 文件
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Content-Disposition:
              $ref: "#/components/headers/CSVContentDisposition"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidAdminTrendQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminRequired"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AdminTrendsUnavailable"
  /api/piles/{deviceId}/history:
    get:
      operationId: getDeviceHistory
      summary: 获取充电桩历史分析
      tags: [History]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/HistoryRange"
        - $ref: "#/components/parameters/Timezone"
      responses:
        "200":
          description: 设备维度的历史指标、每日趋势、热力图和端口摘要
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceHistoryResponse"
        "400":
          $ref: "#/components/responses/InvalidHistoryQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/HistoryNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/HistoryRangeTooLarge"
        "503":
          $ref: "#/components/responses/HistoryUnavailable"
  /api/piles/{deviceId}/ports/{portId}/history:
    get:
      operationId: getPortHistory
      summary: 获取单个充电口历史分析
      tags: [History]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/PortId"
        - $ref: "#/components/parameters/HistoryRange"
        - $ref: "#/components/parameters/Timezone"
      responses:
        "200":
          description: 单个端口的历史指标、每日趋势和最近状态时间线
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortHistoryResponse"
        "400":
          $ref: "#/components/responses/InvalidPortHistoryQuery"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OrdinaryUserRequired"
        "404":
          $ref: "#/components/responses/HistoryNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/HistoryRangeTooLarge"
        "503":
          $ref: "#/components/responses/HistoryUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: charge_session
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 当前用户已绑定的 6–64 位数字设备 ID
      schema:
        type: string
        pattern: "^[0-9]{6,64}$"
    PortId:
      name: portId
      in: path
      required: true
      description: 充电口编号
      schema:
        type: integer
        minimum: 1
        maximum: 100
    HistoryRange:
      name: range
      in: query
      required: false
      description: 历史统计范围；省略时使用 7d
      schema:
        $ref: "#/components/schemas/HistoryRange"
    AdminTrendRange:
      name: range
      in: query
      required: false
      description: 趋势统计范围；省略时使用 24h
      schema:
        $ref: "#/components/schemas/AdminTrendRange"
    Timezone:
      name: timezone
      in: query
      required: false
      description: IANA 时区名称；省略时使用 Asia/Shanghai
      schema:
        type: string
        maxLength: 64
        default: Asia/Shanghai
        example: Asia/Shanghai
    WatchRuleId:
      name: ruleId
      in: path
      required: true
      description: 当前用户关注规则 ID
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9_.-]+$"
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: 当前用户通知 ID
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9_.-]+$"
  headers:
    PrivateNoStore:
      description: 分析响应包含用户或运营数据，不允许共享或本地缓存
      schema:
        type: string
        enum: ["private, no-store"]
    CSVContentDisposition:
      description: 包含范围和导出日期的安全 ASCII 文件名
      schema:
        type: string
        example: attachment; filename="charge-trends-7d-2026-08-05.csv"
  responses:
    InvalidAdminTrendQuery:
      description: 趋势范围或时区参数无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: ADMIN_TREND_QUERY_INVALID
            error: 趋势范围或时区参数无效
    InvalidHistoryQuery:
      description: 设备 ID、历史范围或时区参数无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          examples:
            invalidDevice:
              value:
                code: DEVICE_ID_INVALID
                error: 设备 ID 格式无效
            invalidQuery:
              value:
                code: HISTORY_QUERY_INVALID
                error: 历史范围或时区参数无效
    InvalidPortHistoryQuery:
      description: 设备 ID、端口编号、历史范围或时区参数无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          examples:
            invalidPort:
              value:
                code: PORT_ID_INVALID
                error: 充电口编号格式无效
            invalidQuery:
              value:
                code: HISTORY_QUERY_INVALID
                error: 历史范围或时区参数无效
    Unauthenticated:
      description: 未登录或会话已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: login required
    OrdinaryUserRequired:
      description: 当前账户不是普通用户
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: ordinary user permission required
    AdminRequired:
      description: 当前账户不是管理员
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: admin permission required
    HistoryNotFound:
      description: 设备不属于当前用户、端口不存在或尚无该端口历史
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: HISTORY_NOT_FOUND
            error: 未找到对应的历史记录
    MethodNotAllowed:
      description: 请求方法不受支持
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: method not allowed
    HistoryRangeTooLarge:
      description: 所选范围内的状态变化超过单次分析上限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: HISTORY_RANGE_TOO_LARGE
            error: 该范围内历史变化过多，请缩短查询范围
    HistoryUnavailable:
      description: 历史存储或聚合暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: HISTORY_UNAVAILABLE
            error: 历史数据暂时不可用，请稍后重试
    AdminTrendsUnavailable:
      description: 指标或状态历史聚合暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: ADMIN_TRENDS_UNAVAILABLE
            error: 运营趋势暂时不可用，请稍后重试
    WatchInvalid:
      description: 关注规则字段、星期、时段或时区无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WATCH_RULE_INVALID
            error: 关注规则内容无效
    WatchTargetNotFound:
      description: 充电桩不属于当前用户或端口不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WATCH_TARGET_NOT_FOUND
            error: 未找到当前账户下的充电桩或端口
    WatchRuleNotFound:
      description: 规则不存在或不属于当前用户
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WATCH_RULE_NOT_FOUND
            error: 未找到关注规则
    WatchConflict:
      description: 目标已存在，或达到规则/提醒桩数量限制
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
    WatchUnavailable:
      description: 关注规则存储暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: WATCH_UNAVAILABLE
            error: 关注功能暂时不可用，请稍后重试
    NotificationPreferenceInvalid:
      description: 通知偏好、免打扰时间或时区无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: NOTIFICATION_PREFERENCE_INVALID
            error: 通知偏好内容无效
    NotificationQueryInvalid:
      description: 通知状态、分页大小或游标无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: NOTIFICATION_QUERY_INVALID
            error: 通知筛选或分页参数无效
    NotificationNotFound:
      description: 通知不存在或不属于当前用户
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: NOTIFICATION_NOT_FOUND
            error: 未找到通知
    NotificationUnavailable:
      description: 通知存储暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CodedErrorResponse"
          example:
            code: NOTIFICATION_UNAVAILABLE
            error: 通知功能暂时不可用，请稍后重试
  schemas:
    WatchOverview:
      type: object
      additionalProperties: false
      required:
        - reminderPileCount
        - reminderPileLimit
        - dailyQuotaUsed
        - dailyQuotaLimit
        - quotaDate
        - refreshIntervalMinutes
        - backgroundRemindersEnabled
        - accountRefreshEnabled
        - scheduledPowerOffEnabled
        - scheduledPowerOffStartMinute
        - scheduledPowerOffEndMinute
        - scheduledPowerOffTimezone
      properties:
        reminderPileCount:
          type: integer
          minimum: 0
        reminderPileLimit:
          type: integer
          minimum: 1
        dailyQuotaUsed:
          type: integer
          minimum: 0
        dailyQuotaLimit:
          type: integer
          minimum: 1
        quotaDate:
          type: string
          format: date
        refreshIntervalMinutes:
          type: integer
          minimum: 1
        backgroundRemindersEnabled:
          type: boolean
        accountRefreshEnabled:
          type: boolean
        scheduledPowerOffEnabled:
          type: boolean
        scheduledPowerOffStartMinute:
          type: integer
          minimum: 0
          maximum: 1439
        scheduledPowerOffEndMinute:
          type: integer
          minimum: 0
          maximum: 1439
        scheduledPowerOffTimezone:
          type: string
          maxLength: 64
    WatchRule:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - deviceId
        - enabled
        - activeWeekdays
        - activeStartMinute
        - activeEndMinute
        - timezone
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
